name: Terraform CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        working-directory:  ./190826/terraform_project/environments
        run: terraform init

      - name: Terraform Validate
        working-directory:  ./190826/terraform_project/environments
        run: terraform validate

      - name: Terraform Plan
        working-directory:  ./190826/terraform_project/environments
        run: terraform plan